<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trading Journal | Gongola Tech Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', card: 'var(--card)', border: 'var(--border)',
          win: '#10B981', loss: '#F43F5E', text: 'var(--text)', muted: 'var(--muted)'
        },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  :root {
    --bg: #F1F5F9; --card: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
  }
  .dark {
    --bg: #0B111E; --card: #121B2E; --border: #1E293B; --text: #F8FAFC; --muted: #94A3B8;
  }
  ::-webkit-scrollbar { display: none; }
  body { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .animate-dot { animation: pulse-dot 2s infinite; }
  
  .filter-active { background-color: #10B981; color: #0B111E; border-color: #10B981; }
</style>
</head>
<body class="bg-bg text-text font-sans h-screen overflow-hidden flex justify-center transition-colors duration-300">

  <div class="w-full max-w-md h-full flex flex-col relative md:grid md:grid-cols-3 md:max-w-6xl md:gap-6 md:p-6 md:h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between px-5 py-3 md:col-span-3 md:px-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-win to-teal-700 flex items-center justify-center font-bold text-white shadow-lg">G</div>
        <h1 class="text-lg font-bold tracking-tight">Trading Journal</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="text-xl p-2">🌙</button>
        <div class="relative">
          <button class="text-xs font-semibold bg-card border border-border px-2 py-1.5 rounded-lg hover:border-win transition-colors">CSV</button>
          <input type="file" id="csv-import" accept=".csv" class="absolute inset-0 opacity-0 cursor-pointer" onchange="importCSV(event)">
        </div>
        <button onclick="exportCSV()" class="text-xs font-semibold bg-card border border-border px-2 py-1.5 rounded-lg hover:border-win transition-colors">⬇ Export</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden md:col-span-2 md:bg-card md:border md:border-border md:rounded-2xl md:shadow-xl transition-colors duration-300">
      
      <!-- Metrics & Chart -->
      <div class="bg-bg/50 backdrop-blur-sm z-10 border-b border-border">
        <section class="grid grid-cols-4 gap-2 px-4 py-3">
          <div class="bg-card border border-border rounded-xl p-2 flex flex-col justify-center shadow-sm">
            <span class="text-[9px] uppercase font-bold text-muted tracking-wider mb-1">Net P&L</span>
            <span id="metric-pnl" class="text-sm md:text-xl font-bold text-text">$0.00</span>
          </div>
          <div class="bg-card border border-border rounded-xl p-2 flex flex-col justify-center shadow-sm">
            <span class="text-[9px] uppercase font-bold text-muted tracking-wider mb-1">Win Rate</span>
            <span id="metric-winrate" class="text-sm md:text-xl font-bold text-text">0%</span>
          </div>
          <div class="bg-card border border-border rounded-xl p-2 flex flex-col justify-center shadow-sm">
            <span class="text-[9px] uppercase font-bold text-muted tracking-wider mb-1">Trades</span>
            <span id="metric-count" class="text-sm md:text-xl font-bold text-text">0</span>
          </div>
          <div class="bg-card border border-border rounded-xl p-2 flex flex-col justify-center shadow-sm">
            <span class="text-[9px] uppercase font-bold text-muted tracking-wider mb-1">Streak</span>
            <span id="metric-streak" class="text-sm md:text-xl font-bold text-text">-</span>
          </div>
        </section>

        <!-- Chart Container -->
        <div id="chart-container" class="px-4 pb-4 md:px-6 md:pb-6 transition-all duration-300">
          <div class="bg-card border border-border rounded-xl p-3 shadow-sm h-28 md:h-40 relative">
            <canvas id="equityChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Toolbar: Filters & View Toggle -->
      <div class="px-4 py-2 flex items-center justify-between border-b border-border">
        <div class="flex gap-1 overflow-x-auto no-scrollbar">
          <button onclick="setFilter('all')" id="f-all" class="filter-active text-[10px] font-bold px-3 py-1.5 rounded-full border border-border transition-colors">All</button>
          <button onclick="setFilter('win')" id="f-win" class="text-[10px] font-bold text-muted px-3 py-1.5 rounded-full border border-border transition-colors hover:text-win">Wins</button>
          <button onclick="setFilter('loss')" id="f-loss" class="text-[10px] font-bold text-muted px-3 py-1.5 rounded-full border border-border transition-colors hover:text-loss">Losses</button>
          <button onclick="setFilter('BUY')" id="f-buy" class="text-[10px] font-bold text-muted px-3 py-1.5 rounded-full border border-border transition-colors hover:text-win">Buys</button>
          <button onclick="setFilter('SELL')" id="f-sell" class="text-[10px] font-bold text-muted px-3 py-1.5 rounded-full border border-border transition-colors hover:text-loss">Sells</button>
        </div>
        <button onclick="toggleView()" id="view-toggle" class="text-xs font-bold bg-card border border-border px-2 py-1 rounded-md ml-2 flex-shrink-0">📅</button>
      </div>

      <!-- List View -->
      <section id="trade-feed" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24 md:pb-6">
        <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center opacity-50 mt-4">
          <p class="text-sm font-medium">No trades found.</p>
        </div>
      </section>

      <!-- Calendar View -->
      <section id="calendar-view" class="hidden flex-1 overflow-y-auto p-4 pb-24 md:pb-6">
        <div class="flex justify-between items-center mb-4">
          <button onclick="changeMonth(-1)" class="p-2 bg-card border border-border rounded-lg">&larr;</button>
          <h3 id="calendar-month" class="font-bold text-lg"></h3>
          <button onclick="changeMonth(1)" class="p-2 bg-card border border-border rounded-lg">&rarr;</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center mb-2">
          <span class="text-[10px] font-bold text-muted">Su</span><span class="text-[10px] font-bold text-muted">Mo</span><span class="text-[10px] font-bold text-muted">Tu</span><span class="text-[10px] font-bold text-muted">We</span><span class="text-[10px] font-bold text-muted">Th</span><span class="text-[10px] font-bold text-muted">Fr</span><span class="text-[10px] font-bold text-muted">Sa</span>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </section>

    </main>

    <!-- Overlay Backdrop -->
    <div id="backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden opacity-0 transition-opacity duration-300" onclick="toggleDrawer()"></div>

    <!-- Bottom Drawer Form -->
    <aside id="drawer" class="fixed bottom-0 left-0 w-full bg-card border-t border-border rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-50 translate-y-full transition-transform duration-300 flex flex-col md:static md:translate-y-0 md:col-span-1 md:rounded-2xl md:border md:shadow-xl md:h-full overflow-y-auto">
      <div class="w-full flex justify-center pt-3 pb-1 md:hidden" onclick="toggleDrawer()">
        <div class="w-12 h-1.5 bg-border rounded-full"></div>
      </div>

      <div class="p-5 flex-1 flex flex-col md:p-6 pb-24">
        <h2 class="text-xl font-bold mb-4">Log Trade</h2>
        
        <form id="trade-form" class="flex flex-col gap-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-muted uppercase mb-1">Asset</label>
              <input type="text" id="input-asset" required placeholder="BTCUSD" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-win">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-muted uppercase mb-1">Setup</label>
              <select id="input-setup" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-win">
                <option>Breakout</option><option>Reversal</option><option>FVG</option><option>Trend</option><option>News</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-muted uppercase mb-1">Action</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btn-buy" onclick="setAction('BUY')" class="bg-bg border border-border rounded-lg py-2 text-sm font-bold text-muted transition-all">🟢 BUY</button>
              <button type="button" id="btn-sell" onclick="setAction('SELL')" class="bg-bg border border-border rounded-lg py-2 text-sm font-bold text-muted transition-all">🔴 SELL</button>
            </div>
            <input type="hidden" id="input-action" value="BUY">
          </div>

          <div class="grid grid-cols-2 gap-2">
             <div>
              <label class="block text-[10px] font-bold text-muted uppercase mb-1">Net P&L ($)</label>
              <input type="number" id="input-amount" step="0.01" required placeholder="150.00" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-win">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-muted uppercase mb-1">R:R Ratio</label>
              <div class="flex gap-1">
                <input type="number" id="in-entry" placeholder="Entry" class="w-1/3 bg-bg border border-border rounded-lg px-1 py-2 text-xs text-center" oninput="calcRR()">
                <input type="number" id="in-sl" placeholder="SL" class="w-1/3 bg-bg border border-border rounded-lg px-1 py-2 text-xs text-center" oninput="calcRR()">
                <input type="number" id="in-tp" placeholder="TP" class="w-1/3 bg-bg border border-border rounded-lg px-1 py-2 text-xs text-center" oninput="calcRR()">
              </div>
              <div id="rr-result" class="text-[10px] font-bold text-center mt-1 text-muted">Ratio: --</div>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-muted uppercase mb-1">Notes / Psychology</label>
            <textarea id="input-notes" rows="2" placeholder="Why did you take this trade?" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-win"></textarea>
          </div>

          <div class="pt-2 flex flex-col gap-2">
            <button type="submit" class="w-full bg-win text-bg font-bold text-base rounded-xl py-3 shadow-[0_0_15px_rgba(16,185,129,0.3)]">Save Trade</button>
            <button type="button" onclick="clearAllData()" class="w-full text-loss/80 hover:text-loss text-[10px] font-semibold py-1">Reset Ledger</button>
          </div>
        </form>
      </div>
    </aside>

    <!-- Floating Action Button -->
    <button id="fab" onclick="toggleDrawer()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-win text-bg rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(16,185,129,0.4)] z-30 transition-transform active:scale-90">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>

  </div>

  <script>
    // --- State ---
    let trades = JSON.parse(localStorage.getItem('gongola_trades_v2')) || [];
    let currentAction = 'BUY';
    let currentFilter = 'all';
    let currentView = 'list'; // 'list' or 'calendar'
    let chartInstance = null;
    let calDate = new Date();

    // --- Theme Logic ---
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
      document.querySelector('button[onclick="toggleTheme()"]').innerText = '☀️';
    } else {
      document.documentElement.classList.add('dark');
    }
    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.querySelector('button[onclick="toggleTheme()"]').innerText = isDark ? '🌙' : '☀️';
    }

    // --- DOM Elements ---
    const feed = document.getElementById('trade-feed');
    const calendarView = document.getElementById('calendar-view');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');
    const form = document.getElementById('trade-form');
    
    // Metrics
    const metricPnl = document.getElementById('metric-pnl');
    const metricWinrate = document.getElementById('metric-winrate');
    const metricCount = document.getElementById('metric-count');
    const metricStreak = document.getElementById('metric-streak');

    // Inputs
    const inputAsset = document.getElementById('input-asset');
    const inputAmount = document.getElementById('input-amount');
    const inputSetup = document.getElementById('input-setup');
    const inputNotes = document.getElementById('input-notes');
    const inputAction = document.getElementById('input-action');
    const btnBuy = document.getElementById('btn-buy');
    const btnSell = document.getElementById('btn-sell');

    // --- UI Logic ---
    function toggleDrawer() {
      if (drawer.classList.contains('translate-y-full')) {
        // Open
        drawer.classList.remove('translate-y-full');
        drawer.classList.add('translate-y-0');
        backdrop.classList.remove('hidden');
        setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
      } else {
        // Close
        drawer.classList.remove('translate-y-0');
        drawer.classList.add('translate-y-full');
        backdrop.classList.add('opacity-0');
        setTimeout(() => backdrop.classList.add('hidden'), 300);
      }
    }

    function setAction(action) {
      currentAction = action;
      inputAction.value = action;
      if (action === 'BUY') {
        btnBuy.className = "bg-win/10 border border-win rounded-lg py-2 text-sm font-bold text-win shadow-[0_0_10px_rgba(16,185,129,0.15)]";
        btnSell.className = "bg-bg border border-border rounded-lg py-2 text-sm font-bold text-muted";
      } else {
        btnSell.className = "bg-loss/10 border border-loss rounded-lg py-2 text-sm font-bold text-loss shadow-[0_0_10px_rgba(244,63,94,0.15)]";
        btnBuy.className = "bg-bg border border-border rounded-lg py-2 text-sm font-bold text-muted";
      }
    }
    setAction('BUY');

    function calcRR() {
      const entry = parseFloat(document.getElementById('in-entry').value);
      const sl = parseFloat(document.getElementById('in-sl').value);
      const tp = parseFloat(document.getElementById('in-tp').value);
      const res = document.getElementById('rr-result');
      if (entry && sl && tp) {
        const risk = Math.abs(entry - sl);
        const reward = Math.abs(tp - entry);
        if (risk > 0) {
          res.innerText = `Ratio: 1 : ${(reward / risk).toFixed(2)}`;
          res.className = "text-[10px] font-bold text-center mt-1 text-win";
          return;
        }
      }
      res.innerText = "Ratio: --";
      res.className = "text-[10px] font-bold text-center mt-1 text-muted";
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'win', 'loss', 'BUY', 'SELL'].forEach(f => {
        const btn = document.getElementById('f-' + f.toLowerCase());
        if (f === filter) btn.classList.add('filter-active');
        else btn.classList.remove('filter-active');
      });
      render();
    }

    function toggleView() {
      currentView = currentView === 'list' ? 'calendar' : 'list';
      document.getElementById('view-toggle').innerText = currentView === 'list' ? '📅' : '📋';
      document.getElementById('chart-container').style.display = currentView === 'list' ? 'block' : 'none';
      feed.classList.toggle('hidden', currentView !== 'list');
      calendarView.classList.toggle('hidden', currentView !== 'calendar');
      render();
    }

    function changeMonth(dir) {
      calDate.setMonth(calDate.getMonth() + dir);
      render();
    }

    // --- Data Logic ---
    function saveData() {
      localStorage.setItem('gongola_trades_v2', JSON.stringify(trades));
      render();
    }

    function clearAllData() {
      if (confirm("WARNING: Delete all trade history permanently?")) {
        trades = [];
        saveData();
      }
    }

    function deleteTrade(id) {
      if (confirm("Delete this trade?")) {
        trades = trades.filter(t => t.id !== id);
        saveData();
      }
    }

    function exportCSV() {
      if (trades.length === 0) return alert("No trades to export.");
      let csv = "Date,Asset,Action,Amount,Setup,Notes\n";
      trades.forEach(t => {
        csv += `"${new Date(t.timestamp).toLocaleString()}","${t.asset}","${t.action}",${t.amount},"${t.setup||''}","${(t.notes||'').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Gongola_Trades_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    function importCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const lines = event.target.result.split('\n');
        let imported = 0;
        for(let i=1; i<lines.length; i++) {
          if(!lines[i].trim()) continue;
          // Simple CSV parser for our specific format
          const parts = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
          if (parts && parts.length >= 4) {
            trades.unshift({
              id: Date.now().toString() + i,
              timestamp: new Date(parts[0].replace(/"/g, '')).toISOString(),
              asset: parts[1].replace(/"/g, ''),
              action: parts[2].replace(/"/g, ''),
              amount: parseFloat(parts[3]),
              setup: parts[4] ? parts[4].replace(/"/g, '') : 'Breakout',
              notes: parts[5] ? parts[5].replace(/"/g, '') : ''
            });
            imported++;
          }
        }
        saveData();
        alert(`Successfully imported ${imported} trades!`);
        e.target.value = ''; 
      };
      reader.readAsText(file);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const asset = inputAsset.value.toUpperCase().trim();
      const amount = parseFloat(inputAmount.value);
      if (!asset || isNaN(amount)) return;

      trades.unshift({
        id: Date.now().toString(),
        asset: asset,
        amount: amount,
        action: currentAction,
        setup: inputSetup.value,
        notes: inputNotes.value.trim(),
        timestamp: new Date().toISOString()
      });
      saveData();
      form.reset();
      setAction('BUY');
      calcRR();
      toggleDrawer();
    });

    // --- Render Logic ---
    function formatCurrency(val) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    }

    function formatTime(isoString) {
      return new Date(isoString).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function renderChart() {
      if (currentView !== 'list') return;
      const ctx = document.getElementById('equityChart').getContext('2d');
      const chronTrades = [...trades].reverse();
      let cumulative = 0;
      const labels = chronTrades.map(t => formatTime(t.timestamp).split(',')[0]);
      const dataPoints = chronTrades.map(t => { cumulative += t.amount; return cumulative; });

      if (dataPoints.length === 0) { labels.push('Start'); dataPoints.push(0); }
      if (chartInstance) chartInstance.destroy();

      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? '#1E293B' : '#E2E8F0';

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: cumulative >= 0 ? '#10B981' : '#F43F5E',
            backgroundColor: cumulative >= 0 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(244, 63, 94, 0.1)',
            borderWidth: 2, pointRadius: 0, fill: true, tension: 0.3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { display: false } }
        }
      });
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendar-month').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      // Empty cells for days before the 1st
      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-12"></div>`;
      }

      // Days of the month
      for (let day = 1; day <= daysInMonth; day++) {
        // Filter trades for this specific day
        const dayTrades = trades.filter(t => {
          const d = new Date(t.timestamp);
          return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
        });

        let pnl = dayTrades.reduce((sum, t) => sum + t.amount, 0);
        let bg = 'bg-card border-border';
        let text = 'text-text';
        
        if (dayTrades.length > 0) {
          if (pnl > 0) { bg = 'bg-win/20 border-win/50'; text = 'text-win'; }
          else if (pnl < 0) { bg = 'bg-loss/20 border-loss/50'; text = 'text-loss'; }
          else { bg = 'bg-muted/20 border-muted/50'; text = 'text-muted'; }
        }

        grid.innerHTML += `
          <div class="h-12 border rounded-lg ${bg} flex flex-col items-center justify-center p-1">
            <span class="text-[10px] font-bold ${text}">${day}</span>
            ${dayTrades.length > 0 ? `<span class="text-[8px] font-mono ${text}">${pnl > 0 ? '+' : ''}${pnl.toFixed(0)}</span>` : ''}
          </div>
        `;
      }
    }

    function render() {
      // 1. Calculate All Metrics
      const totalPnl = trades.reduce((sum, t) => sum + t.amount, 0);
      const wins = trades.filter(t => t.amount > 0).length;
      const winRate = trades.length > 0 ? Math.round((wins / trades.length) * 100) : 0;
      
      // Calculate Streak
      let streak = 0;
      let streakType = '';
      for(let i=0; i<trades.length; i++) {
        const isWin = trades[i].amount > 0;
        if(i === 0) { streak = 1; streakType = isWin ? 'W' : 'L'; }
        else if ((isWin && streakType === 'W') || (!isWin && streakType === 'L')) { streak++; }
        else { break; }
      }

      // 2. Update Metrics UI
      metricPnl.textContent = formatCurrency(totalPnl);
      metricPnl.className = `text-sm md:text-xl font-bold ${totalPnl > 0 ? 'text-win' : totalPnl < 0 ? 'text-loss' : 'text-text'}`;
      metricWinrate.textContent = `${winRate}%`;
      metricWinrate.className = `text-sm md:text-xl font-bold ${winRate >= 50 ? 'text-win' : 'text-loss'}`;
      metricCount.textContent = trades.length;
      
      if (trades.length === 0) {
        metricStreak.textContent = '-';
        metricStreak.className = `text-sm md:text-xl font-bold text-text`;
      } else {
        metricStreak.textContent = `${streak} ${streakType}`;
        metricStreak.className = `text-sm md:text-xl font-bold ${streakType === 'W' ? 'text-win' : 'text-loss'}`;
      }

      // 3. Render Views
      if (currentView === 'calendar') {
        renderCalendar();
        return; // Skip list and chart if in calendar view
      }

      feed.innerHTML = '';
      
      // Filter Logic
      let filteredTrades = trades;
      if (currentFilter === 'win') filteredTrades = trades.filter(t => t.amount > 0);
      else if (currentFilter === 'loss') filteredTrades = trades.filter(t => t.amount <= 0);
      else if (currentFilter === 'BUY' || currentFilter === 'SELL') filteredTrades = trades.filter(t => t.action === currentFilter);

      if (filteredTrades.length === 0) {
        feed.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center opacity-50 mt-4"><p class="text-sm font-medium">No trades match this filter.</p></div>`;
      } else {
        filteredTrades.forEach(trade => {
          const isWin = trade.amount > 0;
          const sign = isWin ? '+' : '';
          
          // Build Notes HTML
          let notesHtml = trade.notes ? `<p class="text-[10px] text-muted mt-2 italic bg-bg/50 p-1.5 rounded">"${trade.notes}"</p>` : '';
          
          // Build Setup HTML
          let setupHtml = trade.setup ? `<span class="text-[8px] font-bold bg-border text-text px-1.5 py-0.5 rounded ml-2">${trade.setup}</span>` : '';

          const card = document.createElement('div');
          card.className = `bg-card border border-border rounded-xl p-3 shadow-sm relative overflow-hidden ${isWin ? 'border-l-4 border-l-win' : 'border-l-4 border-l-loss'}`;
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div class="flex flex-col">
                <div class="flex items-center mb-1">
                  <span class="text-xs font-semibold text-muted">${trade.action} · ${trade.asset}</span>
                  ${setupHtml}
                </div>
                <span class="text-lg font-bold ${isWin ? 'text-win' : 'text-loss'}">${sign}${formatCurrency(trade.amount)}</span>
                <span class="text-[9px] text-muted mt-0.5 font-mono">${formatTime(trade.timestamp)}</span>
                ${notesHtml}
              </div>
              <button onclick="deleteTrade('${trade.id}')" class="p-1.5 text-muted hover:text-loss transition-colors rounded-lg bg-bg border border-border hover:border-loss/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          `;
          feed.appendChild(card);
        });
      }
      
      renderChart();
    }

    render();
  </script>
</body>
</html>
