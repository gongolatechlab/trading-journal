<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal | Gongola ICT Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0a0e13; color: #eef1fb; font-family: 'Inter', sans-serif; }
        .glass-card { background: linear-gradient(180deg, rgba(26,35,47,0.8) 0%, rgba(15,21,28,0.9) 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        .btn-glow { box-shadow: 0 0 20px rgba(34, 229, 143, 0.3); }
        input, select { font-family: inherit; }
    </style>
</head>
<body class="p-4 max-w-3xl mx-auto pb-20">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center font-bold text-black text-xl">J</div>
            <div>
                <h1 id="header-title" class="text-xl font-bold">My Trading Journal</h1>
                <p class="text-xs text-gray-400">Gongola ICT Hub</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://gongolatechlab.github.io/gongola-ict-hub/signals/" class="text-sm text-cyan-400">Signals</a>
            <button onclick="toggleSettings()" class="text-gray-400 hover:text-white transition-colors">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            </button>
        </div>
    </header>

    <!-- Machine Performance Button -->
    <button onclick="toggleMachinePerformance()" class="w-full mb-6 py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold text-lg rounded-xl btn-glow transition-all active:scale-95 flex justify-center items-center gap-2">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Show Our Machine's Performance
    </button>

    <!-- Machine Performance Dashboard -->
    <div id="machine-performance" class="hidden mb-6 glass-card p-6 border border-emerald-500/30">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-emerald-400">Gongola Algorithm Results</h2>
            <button onclick="toggleMachinePerformance()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Win Rate</p>
                <p id="stat-winrate" class="text-xl font-bold text-emerald-400">0%</p>
            </div>
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Total Points</p>
                <p id="stat-points" class="text-xl font-bold text-white">0.0</p>
            </div>
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Closed Trades</p>
                <p id="stat-trades" class="text-xl font-bold text-white">0</p>
            </div>
        </div>
        
        <div id="machine-trades" class="space-y-2 max-h-60 overflow-y-auto pr-1 text-sm"></div>
    </div>

    <!-- Personal Journal Section -->
    <div class="flex justify-between items-end mb-3">
        <h3 class="text-md font-bold text-gray-400 uppercase tracking-wider">My Logged Trades</h3>
        <button onclick="toggleLogModal()" class="px-3 py-1 bg-gray-800 border border-gray-700 rounded-lg text-sm text-white hover:border-emerald-400 transition-colors">+ Add Trade</button>
    </div>

    <div id="my-trades-list" class="space-y-3"></div>

    <!-- Log Trade Modal -->
    <div id="log-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="glass-card p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Log a Trade</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400">Asset</label>
                    <input type="text" id="log-asset" placeholder="e.g. XAUUSD" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-emerald-400">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-400">Direction</label>
                        <select id="log-direction" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Result</label>
                        <select id="log-result" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="win">WIN</option>
                            <option value="loss">LOSS</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-400">Entry</label>
                        <input type="number" id="log-entry" step="any" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Exit</label>
                        <input type="number" id="log-exit" step="any" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="toggleLogModal()" class="flex-1 py-2 bg-gray-800 text-white rounded-lg font-bold">Cancel</button>
                    <button onclick="savePersonalTrade()" class="flex-1 py-2 bg-emerald-500 text-black rounded-lg font-bold">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="glass-card p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Settings</h2>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div class="space-y-5">
                <!-- Profile -->
                <div>
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">Trader Profile</h3>
                    <label class="text-[10px] text-gray-400">Your Name</label>
                    <input type="text" id="set-name" placeholder="e.g. Hadi" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none mb-2 focus:border-emerald-400">
                    <label class="text-[10px] text-gray-400">Starting Balance ($)</label>
                    <input type="number" id="set-balance" placeholder="1000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-emerald-400">
                </div>

                <!-- Preferences -->
                <div>
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">Preferences</h3>
                    <label class="text-[10px] text-gray-400">Default Asset</label>
                    <input type="text" id="set-asset" placeholder="XAUUSD" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none mb-2 focus:border-emerald-400">
                    <label class="text-[10px] text-gray-400">Default Risk (%)</label>
                    <input type="number" id="set-risk" placeholder="1" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-emerald-400">
                </div>

                <!-- Notifications -->
                <div>
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">Machine Alerts</h3>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="set-notify" class="w-4 h-4 accent-emerald-500">
                        <span class="text-sm text-gray-300">Notify me on new signals</span>
                    </label>
                </div>

                <!-- Data Management -->
                <div class="pt-4 border-t border-gray-800">
                    <h3 class="text-xs font-bold text-red-400 uppercase tracking-wider mb-2">Danger Zone</h3>
                    <div class="flex gap-2">
                        <button onclick="exportCSV()" class="flex-1 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg text-sm font-bold">Export CSV</button>
                        <button onclick="clearJournal()" class="flex-1 py-2 bg-red-900/50 border border-red-700 text-red-400 rounded-lg text-sm font-bold">Clear Data</button>
                    </div>
                </div>

                <button onclick="saveSettings()" class="w-full py-3 bg-emerald-500 text-black rounded-lg font-bold text-lg mt-2">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // --- SUPABASE MACHINE PERFORMANCE ---
        const supabaseUrl = 'https://usayycqwgdyklfzrinvc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYXl5Y3F3Z2R5a2xmenJpbnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTg5NjYsImV4cCI6MjEwOTE5NDk2Nn0.jgEo3bvyKK_ak1yMRILX-32tCrg8BKSlzDvu-ccDq3w';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchMachinePerformance() {
            const { data, error } = await supabase.from('signals').select('*').in('result', ['win', 'loss']).order('created_at', { ascending: false });
            if (error || !data) return;

            let totalPoints = 0;
            let wins = 0;

            const html = data.map(t => {
                const entry = parseFloat(t.entry);
                const tp = parseFloat(t.tp);
                const sl = parseFloat(t.sl);
                
                let points = 0;
                const risk = Math.abs(entry - sl);
                const reward = Math.abs(tp - entry);

                if (t.result === 'win') {
                    wins++;
                    points = reward;
                } else {
                    points = -risk;
                }
                totalPoints += points;

                const resultColor = t.result === 'win' ? 'text-emerald-400' : 'text-red-400';
                return `
                    <div class="flex justify-between p-2 bg-black/20 rounded border border-gray-800">
                        <div><span class="font-bold">${t.asset}</span> <span class="text-xs text-gray-400">${t.direction}</span></div>
                        <div class="${resultColor} font-mono">${points > 0 ? '+' : ''}${points.toFixed(1)} pts</div>
                    </div>
                `;
            }).join('');

            document.getElementById('machine-trades').innerHTML = html || '<p class="text-gray-500 text-center">No closed trades yet.</p>';
            
            const winRate = data.length > 0 ? Math.round((wins / data.length) * 100) : 0;
            document.getElementById('stat-winrate').innerText = winRate + '%';
            document.getElementById('stat-trades').innerText = data.length;
            document.getElementById('stat-points').innerText = (totalPoints > 0 ? '+' : '') + totalPoints.toFixed(1);
            document.getElementById('stat-points').className = totalPoints >= 0 ? 'text-xl font-bold text-emerald-400' : 'text-xl font-bold text-red-400';
        }

        function toggleMachinePerformance() {
            const el = document.getElementById('machine-performance');
            el.classList.toggle('hidden');
            if (!el.classList.contains('hidden')) fetchMachinePerformance();
        }

        // --- PERSONAL JOURNAL ---
        function toggleLogModal() {
            // Pre-fill defaults from settings
            const settings = JSON.parse(localStorage.getItem('journalSettings') || '{}');
            if (settings.asset) document.getElementById('log-asset').value = settings.asset;
            document.getElementById('log-modal').classList.toggle('hidden');
        }

        function savePersonalTrade() {
            const asset = document.getElementById('log-asset').value.toUpperCase();
            const direction = document.getElementById('log-direction').value;
            const result = document.getElementById('log-result').value;
            const entry = parseFloat(document.getElementById('log-entry').value);
            const exit = parseFloat(document.getElementById('log-exit').value);

            if (!asset || isNaN(entry) || isNaN(exit)) return alert("Please fill all fields");

            let points = result === 'win' ? Math.abs(exit - entry) : -Math.abs(exit - entry);
            if (direction === 'SELL') {
                points = result === 'win' ? Math.abs(entry - exit) : -Math.abs(entry - exit);
            }

            const trade = { id: Date.now(), asset, direction, result, entry, exit, points };
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');
            myTrades.unshift(trade);
            localStorage.setItem('myTrades', JSON.stringify(myTrades));

            document.getElementById('log-asset').value = '';
            document.getElementById('log-entry').value = '';
            document.getElementById('log-exit').value = '';
            
            toggleLogModal();
            renderPersonalJournal();
        }

        function renderPersonalJournal() {
            const list = document.getElementById('my-trades-list');
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');

            if (myTrades.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 py-8">No trades logged yet. Start journaling!</p>';
                return;
            }

            list.innerHTML = myTrades.map(t => {
                const color = t.result === 'win' ? 'text-emerald-400' : 'text-red-400';
                return `
                    <div class="glass-card p-4 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-lg">${t.asset}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${t.direction === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${t.direction}</span>
                            </div>
                            <p class="text-xs text-gray-400">Entry: ${t.entry} | Exit: ${t.exit}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-mono ${color}">${t.points > 0 ? '+' : ''}${t.points.toFixed(1)} pts</p>
                            <button onclick="deletePersonalTrade(${t.id})" class="text-xs text-gray-500 hover:text-red-400 mt-1">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deletePersonalTrade(id) {
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');
            myTrades = myTrades.filter(t => t.id !== id);
            localStorage.setItem('myTrades', JSON.stringify(myTrades));
            renderPersonalJournal();
        }

        // --- SETTINGS LOGIC ---
        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('journalSettings') || '{}');
            if (settings.name) {
                document.getElementById('set-name').value = settings.name;
                document.getElementById('header-title').innerText = settings.name + "'s Journal";
            }
            if (settings.balance) document.getElementById('set-balance').value = settings.balance;
            if (settings.asset) document.getElementById('set-asset').value = settings.asset;
            if (settings.risk) document.getElementById('set-risk').value = settings.risk;
            if (settings.notify) document.getElementById('set-notify').checked = settings.notify;
        }

        function saveSettings() {
            const name = document.getElementById('set-name').value;
            const balance = document.getElementById('set-balance').value;
            const asset = document.getElementById('set-asset').value.toUpperCase();
            const risk = document.getElementById('set-risk').value;
            const notify = document.getElementById('set-notify').checked;

            const settings = { name, balance, asset, risk, notify };
            localStorage.setItem('journalSettings', JSON.stringify(settings));

            if (name) document.getElementById('header-title').innerText = name + "'s Journal";

            if (notify && "Notification" in window) {
                Notification.requestPermission();
            }

            toggleSettings();
            alert("Settings saved!");
        }

        function exportCSV() {
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');
            if (myTrades.length === 0) return alert("No trades to export.");

            const headers = "ID,Asset,Direction,Result,Entry,Exit,Points\n";
            const rows = myTrades.map(t => 
                `${t.id},${t.asset},${t.direction},${t.result},${t.entry},${t.exit},${t.points}`
            ).join("\n");

            const blob = new Blob([headers + rows], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'my_trading_journal.csv');
            a.click();
        }

        function clearJournal() {
            if (confirm("Are you sure? This will permanently delete all your logged trades.")) {
                localStorage.removeItem('myTrades');
                renderPersonalJournal();
            }
        }

        // Init
        loadSettings();
        renderPersonalJournal();
    </script>
</body>
</html>
