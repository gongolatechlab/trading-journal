<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal | Gongola ICT Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0a0e13; color: #eef1fb; font-family: 'Inter', sans-serif; }
        .glass-card { background: linear-gradient(180deg, rgba(26,35,47,0.8) 0%, rgba(15,21,28,0.9) 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        .btn-glow { box-shadow: 0 0 20px rgba(34, 229, 143, 0.3); }
    </style>
</head>
<body class="p-4 max-w-3xl mx-auto pb-20">

    <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center font-bold text-black text-xl">J</div>
            <div>
                <h1 class="text-xl font-bold">My Trading Journal</h1>
                <p class="text-xs text-gray-400">Gongola ICT Hub</p>
            </div>
        </div>
        <a href="https://gongolatechlab.github.io/gongola-ict-hub/signals/" class="text-sm text-cyan-400">View Signals</a>
    </header>

    <button onclick="toggleMachinePerformance()" class="w-full mb-6 py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold text-lg rounded-xl btn-glow transition-all active:scale-95 flex justify-center items-center gap-2">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Show Our Machine's Performance
    </button>

    <div id="machine-performance" class="hidden mb-6 glass-card p-6 border border-emerald-500/30">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-emerald-400">Gongola Algorithm Results</h2>
            <button onclick="toggleMachinePerformance()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Win Rate</p>
                <p id="stat-winrate" class="text-xl font-bold text-emerald-400">0%</p>
            </div>
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Total Points</p>
                <p id="stat-points" class="text-xl font-bold text-white">0.0</p>
            </div>
            <div class="p-3 bg-black/40 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Closed Trades</p>
                <p id="stat-trades" class="text-xl font-bold text-white">0</p>
            </div>
        </div>
        
        <div id="machine-trades" class="space-y-2 max-h-60 overflow-y-auto pr-1 text-sm">
            <!-- Machine trades will load here -->
        </div>
    </div>

    <div class="flex justify-between items-end mb-3">
        <h3 class="text-md font-bold text-gray-400 uppercase tracking-wider">My Logged Trades</h3>
        <button onclick="toggleLogModal()" class="px-3 py-1 bg-gray-800 border border-gray-700 rounded-lg text-sm text-white hover:border-emerald-400 transition-colors">+ Add Trade</button>
    </div>

    <div id="my-trades-list" class="space-y-3">
        <p class="text-center text-gray-400 py-8">No trades logged yet. Start journaling!</p>
    </div>

    <div id="log-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="glass-card p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Log a Trade</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400">Asset</label>
                    <input type="text" id="log-asset" placeholder="e.g. XAUUSD" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-emerald-400">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-400">Direction</label>
                        <select id="log-direction" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Result</label>
                        <select id="log-result" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="win">WIN</option>
                            <option value="loss">LOSS</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-400">Entry</label>
                        <input type="number" id="log-entry" step="any" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Exit</label>
                        <input type="number" id="log-exit" step="any" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="toggleLogModal()" class="flex-1 py-2 bg-gray-800 text-white rounded-lg font-bold">Cancel</button>
                    <button onclick="savePersonalTrade()" class="flex-1 py-2 bg-emerald-500 text-black rounded-lg font-bold">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://usayycqwgdyklfzrinvc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYXl5Y3F3Z2R5a2xmenJpbnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTg5NjYsImV4cCI6MjEwOTE5NDk2Nn0.jgEo3bvyKK_ak1yMRILX-32tCrg8BKSlzDvu-ccDq3w';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchMachinePerformance() {
            const { data, error } = await supabase.from('signals').select('*').in('result', ['win', 'loss']).order('created_at', { ascending: false });
            if (error || !data) return;

            let totalPoints = 0;
            let wins = 0;

            const html = data.map(t => {
                const entry = parseFloat(t.entry);
                const tp = parseFloat(t.tp);
                const sl = parseFloat(t.sl);
                
                let points = 0;
                const risk = Math.abs(entry - sl);
                const reward = Math.abs(tp - entry);

                if (t.result === 'win') {
                    wins++;
                    points = reward;
                } else {
                    points = -risk;
                }
                totalPoints += points;

                const resultColor = t.result === 'win' ? 'text-emerald-400' : 'text-red-400';
                return `
                    <div class="flex justify-between p-2 bg-black/20 rounded border border-gray-800">
                        <div><span class="font-bold">${t.asset}</span> <span class="text-xs text-gray-400">${t.direction}</span></div>
                        <div class="${resultColor} font-mono">${points > 0 ? '+' : ''}${points.toFixed(1)} pts</div>
                    </div>
                `;
            }).join('');

            document.getElementById('machine-trades').innerHTML = html || '<p class="text-gray-500 text-center">No closed trades yet.</p>';
            
            const winRate = data.length > 0 ? Math.round((wins / data.length) * 100) : 0;
            document.getElementById('stat-winrate').innerText = winRate + '%';
            document.getElementById('stat-trades').innerText = data.length;
            document.getElementById('stat-points').innerText = (totalPoints > 0 ? '+' : '') + totalPoints.toFixed(1);
            document.getElementById('stat-points').className = totalPoints >= 0 ? 'text-xl font-bold text-emerald-400' : 'text-xl font-bold text-red-400';
        }

        function toggleMachinePerformance() {
            const el = document.getElementById('machine-performance');
            el.classList.toggle('hidden');
            if (!el.classList.contains('hidden')) fetchMachinePerformance();
        }

        function toggleLogModal() {
            document.getElementById('log-modal').classList.toggle('hidden');
        }

        function savePersonalTrade() {
            const asset = document.getElementById('log-asset').value.toUpperCase();
            const direction = document.getElementById('log-direction').value;
            const result = document.getElementById('log-result').value;
            const entry = parseFloat(document.getElementById('log-entry').value);
            const exit = parseFloat(document.getElementById('log-exit').value);

            if (!asset || isNaN(entry) || isNaN(exit)) return alert("Please fill all fields");

            let points = result === 'win' ? Math.abs(exit - entry) : -Math.abs(exit - entry);
            if (direction === 'SELL') {
                points = result === 'win' ? Math.abs(entry - exit) : -Math.abs(entry - exit);
            }

            const trade = { id: Date.now(), asset, direction, result, entry, exit, points };
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');
            myTrades.unshift(trade);
            localStorage.setItem('myTrades', JSON.stringify(myTrades));

            document.getElementById('log-asset').value = '';
            document.getElementById('log-entry').value = '';
            document.getElementById('log-exit').value = '';
            
            toggleLogModal();
            renderPersonalJournal();
        }

        function renderPersonalJournal() {
            const list = document.getElementById('my-trades-list');
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');

            if (myTrades.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 py-8">No trades logged yet. Start journaling!</p>';
                return;
            }

            list.innerHTML = myTrades.map(t => {
                const color = t.result === 'win' ? 'text-emerald-400' : 'text-red-400';
                return `
                    <div class="glass-card p-4 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-lg">${t.asset}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${t.direction === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${t.direction}</span>
                            </div>
                            <p class="text-xs text-gray-400">Entry: ${t.entry} | Exit: ${t.exit}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-mono ${color}">${t.points > 0 ? '+' : ''}${t.points.toFixed(1)} pts</p>
                            <button onclick="deletePersonalTrade(${t.id})" class="text-xs text-gray-500 hover:text-red-400 mt-1">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deletePersonalTrade(id) {
            let myTrades = JSON.parse(localStorage.getItem('myTrades') || '[]');
            myTrades = myTrades.filter(t => t.id !== id);
            localStorage.setItem('myTrades', JSON.stringify(myTrades));
            renderPersonalJournal();
        }

        renderPersonalJournal();
    </script>
</body>
</html>
